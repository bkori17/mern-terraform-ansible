---
- name: Secure MongoDB
  hosts: database
  become: true
  gather_facts: true

  tasks:
    - name: Back up MongoDB configuration
      ansible.builtin.copy:
        src: /etc/mongod.conf
        dest: /etc/mongod.conf.pre-mern
        remote_src: true
        force: false
        mode: '0600'

    - name: Configure MongoDB private network binding
      ansible.builtin.lineinfile:
        path: /etc/mongod.conf
        regexp: '^\s*bindIp:'
        line: '  bindIp: 127.0.0.1,{{ ansible_host }}'
      notify: Restart MongoDB

    - name: Enable authentication
      ansible.builtin.blockinfile:
        path: /etc/mongod.conf
        marker: "# {mark} ANSIBLE MANAGED SECURITY"
        block: |
          security:
            authorization: enabled
      notify: Restart MongoDB

    - name: Apply MongoDB configuration
      ansible.builtin.meta: flush_handlers

    - name: Verify MongoDB service
      ansible.builtin.command:
        cmd: systemctl is-active mongod
      changed_when: false

  handlers:
    - name: Restart MongoDB
      ansible.builtin.systemd_service:
        name: mongod
        state: restarted
